# ═══════════════════════════════════════════════════════════════════════════
# TMUX CONFIGURATION - Catppuccin Macchiato + Termux SSH
# ═══════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────
# TRUE COLOR & TERMINAL SUPPORT
# ───────────────────────────────────────────────────────────────────────────

# Enable 256 colors - use tmux-256color for best compatibility
set -g default-terminal "tmux-256color"

# Enable RGB (truecolor) support - tmux 3.2+
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-overrides ",*:Tc"

# Enable OSC 8 hyperlink support (tmux 3.4+)
# This allows proper hyperlinks to pass through tmux to WezTerm
set -as terminal-features ",*:hyperlinks"

# Allow WezTerm/terminal to handle mouse for URLs when passthrough is needed
# set -g allow-passthrough on

# Enable mouse support
set -g mouse on

# Fix for nvim and other editors (reduce escape time)
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Focus events for vim/nvim
set -g focus-events on

# Aggressive resize (useful for multiple screen sizes)
setw -g aggressive-resize on

# ───────────────────────────────────────────────────────────────────────────
# KEY BINDINGS
# ───────────────────────────────────────────────────────────────────────────

# Change prefix from C-b to C-] (avoids readline conflicts)
unbind C-b
set -g prefix C-]
bind C-] send-prefix

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ───────────────────────────────────────────────────────────────────────────
# TPM PLUGINS
# ───────────────────────────────────────────────────────────────────────────

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ───────────────────────────────────────────────────────────────────────────
# CATPPUCCIN THEME CONFIGURATION
# ───────────────────────────────────────────────────────────────────────────

# Set Catppuccin flavor to Macchiato
set -g @catppuccin_flavor 'macchiato'

# Window status style
set -g @catppuccin_window_status_style 'rounded'

# Status modules (left side)
set -g @catppuccin_status_left_separator "█"

# Status modules (right side)
set -g @catppuccin_status_modules_right "session host date_time"
set -g @catppuccin_status_right_separator "█"

# Date/time format
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# Window format
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

# ───────────────────────────────────────────────────────────────────────────
# INITIALIZE TPM (keep this line at the very bottom)
# ───────────────────────────────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
